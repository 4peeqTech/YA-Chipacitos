# Salida a producción de pedidos de locales + mayorista (OK de Marcos, 26-10).
# Corre sola a las 21:00 de Argentina (00:00 UTC del 27-10) o a mano desde Actions.
# Modo "prueba": hace los controles y el db push --dry-run, sin cambiar nada.
# Se borra después de la salida, junto con el secreto PROD_DB_URL.
name: Salida a producción · pedidos (26-10)

on:
  schedule:
    - cron: '0 0 27 10 *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'prueba = no cambia nada · real = migra, cierra los 15 pendientes y despliega'
        required: true
        default: prueba
        type: choice
        options: [prueba, real]

permissions:
  contents: write

concurrency:
  group: salida-pedidos
  cancel-in-progress: false

jobs:
  salida:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODO: ${{ github.event_name == 'schedule' && 'real' || inputs.modo }}
      DB_URL: ${{ secrets.PROD_DB_URL }}
      RAMA: hotfix/pedidos-locales
      APP: https://app.yachipacitos.com.ar
      MIGRACIONES: "'20261020120000','20261022120000','20261026100000'"
      # Los 15 pendientes al mayorista (13-10 al 22-10) que Marcos decidió cerrar como recibidos.
      CORTE_PENDIENTES: '2026-10-23 00:00:00-03'
      MAX_PENDIENTES: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/pedidos-locales
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Controles (no cambia nada)
        run: |
          set -euo pipefail
          echo "Modo: $MODO"
          [ "$(TZ=America/Argentina/Buenos_Aires date +%Y)" = 2026 ] || { echo "::error::No es 2026: no se hace nada."; exit 1; }
          [ -n "$DB_URL" ] || { echo "::error::Falta el secreto PROD_DB_URL."; exit 1; }
          git fetch -q origin main "$RAMA"
          MAIN=$(git rev-parse origin/main); HOT=$(git rev-parse "origin/$RAMA")
          echo "main=$MAIN rama=$HOT"
          git merge-base --is-ancestor "$MAIN" "$HOT" || { echo "::error::main se movió: el merge ya no es directo."; exit 1; }
          PROD=$(curl -fsS "$APP/api/entorno" | jq -r .commit)
          echo "prod corre $PROD"
          # Prod tiene que correr main, o el commit anterior si la única diferencia es este workflow.
          git merge-base --is-ancestor "$PROD" "$MAIN" && git diff --quiet "$PROD" "$MAIN" -- . ':!.github' \
            || { echo "::error::Prod corre $PROD, que no coincide con main ($MAIN)."; exit 1; }
          YA=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations where version in ($MIGRACIONES)")
          [ "$YA" = 0 ] || { echo "::error::Ya hay $YA de las 3 migraciones en prod: no se repite."; exit 1; }
          N=$(psql "$DB_URL" -tAc "select count(*) from pedidos where destino='fabrica' and estado='pendiente' and created_at < '$CORTE_PENDIENTES'")
          echo "pendientes a cerrar: $N"
          [ "$N" -le "$MAX_PENDIENTES" ] || { echo "::error::Hay $N pendientes viejos (esperaba $MAX_PENDIENTES o menos)."; exit 1; }
          psql "$DB_URL" -c "select destino, estado, count(*) from pedidos group by 1,2 order by 1,2"
          supabase db push --db-url "$DB_URL" --dry-run 2>&1 | tee /tmp/dry.txt
          [ "$(grep -cE '20261020120000_|20261022120000_|20261026100000_' /tmp/dry.txt)" = 3 ] && [ "$(grep -cE '[0-9]{14}_.*\.sql' /tmp/dry.txt)" = 3 ] || { echo "::error::El dry-run no lista exactamente las 3 migraciones."; exit 1; }
          echo "HOT=$HOT" >> "$GITHUB_ENV"
          { echo "### Controles OK ($MODO)"; echo "- prod: \`$PROD\` (main: \`$MAIN\`)"; echo "- pendientes a cerrar: $N"; echo "- migraciones pendientes: 3"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Migraciones a prod
        if: env.MODO == 'real'
        run: |
          set -euo pipefail
          supabase db push --db-url "$DB_URL" --yes

      - name: Cerrar los pendientes viejos como recibidos
        if: env.MODO == 'real'
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<SQL
          do \$\$
          declare n int;
          begin
            with cerrados as (
              update public.pedidos
                set estado = 'recibido', recibido_at = created_at, cierre_automatico = true
                where destino = 'fabrica' and estado = 'pendiente' and created_at < '$CORTE_PENDIENTES'
                returning id
            ), ev as (
              insert into public.pedido_eventos (pedido_id, tipo, detalle, autor_nombre, autor_rol)
              select id, 'cierre_automatico',
                     jsonb_build_object('motivo', 'Cerrado como recibido al pasar a la versión nueva'),
                     'Sistema', 'sistema'
              from cerrados
              returning 1
            )
            select count(*) into n from ev;
            if n > $MAX_PENDIENTES then
              raise exception 'Se iban a cerrar % pedidos (esperaba $MAX_PENDIENTES o menos)', n;
            end if;
            raise notice 'Pendientes cerrados: %', n;
          end \$\$;
          SQL

      - name: Comprobar la base
        if: env.MODO == 'real'
        run: |
          set -euo pipefail
          R=$(psql "$DB_URL" -tAc "select
            (select count(*) from supabase_migrations.schema_migrations where version in ($MIGRACIONES)) = 3
            and (select count(*) from information_schema.tables where table_schema='public' and table_name='pedido_eventos') = 1
            and (select count(*) from information_schema.columns where table_schema='public' and table_name='productos' and column_name='icono') = 1
            and (select count(*) from config where key='pedidos_version_desde') = 1
            and (select count(*) from pg_proc where proname='pedidos_inicio_version') >= 1")
          [ "$R" = t ] || { echo "::error::Faltan objetos en prod después de migrar."; exit 1; }
          psql "$DB_URL" -c "select destino, estado, count(*), count(*) filter (where cierre_automatico) automaticos from pedidos group by 1,2 order by 1,2"

      - name: Pasar la rama a main (Vercel despliega)
        if: env.MODO == 'real'
        run: |
          set -euo pipefail
          git push origin "$HOT:refs/heads/main"

      - name: Esperar el deploy y prueba rápida
        if: env.MODO == 'real'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            C=$(curl -fsS "$APP/api/entorno" | jq -r .commit || true)
            [ "$C" = "$HOT" ] && break
            sleep 20
          done
          [ "$C" = "$HOT" ] || { echo "::error::A los 20 minutos prod sigue en $C (esperaba $HOT). Revisar Vercel."; exit 1; }
          curl -fsS "$APP/api/entorno" | jq -e '.ok == true and (.problemas | length) == 0 and .refCliente == "ahlpthzsjipdpcnjbfdk"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$APP/login")" = 200 ] || { echo "::error::/login no responde 200."; exit 1; }
          { echo "### Salida hecha"; echo "- prod corre \`$HOT\`"; echo "- migraciones aplicadas y pendientes cerrados"; } >> "$GITHUB_STEP_SUMMARY"
